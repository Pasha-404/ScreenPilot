name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows-installer:
    name: Build Windows Setup EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install packaging tools
        shell: powershell
        run: choco install innosetup 7zip -y --no-progress

      - name: Restore verified mpv runtime
        shell: powershell
        run: .\packaging\prepare-mpv-runtime.ps1

      - name: Set release version
        shell: powershell
        run: |
          $versionLine = Get-Content -LiteralPath gradle.properties |
            Where-Object { $_ -match '^version=' } |
            Select-Object -First 1
          if ($null -eq $versionLine) {
            throw "gradle.properties must define the canonical version property."
          }
          $version = $versionLine.Substring('version='.Length).Trim()
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:GITHUB_REF.Substring("refs/tags/v".Length)
          }
          if ($version -notmatch "^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$") {
            throw "Tag version must use MAJOR.MINOR.PATCH SemVer, got: $version"
          }
          "SCREENPILOT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build installer and release metadata
        shell: cmd
        run: gradlew.bat clean buildWindowsInstaller "-Pversion=%SCREENPILOT_VERSION%"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: ScreenPilot-windows-release
          path: dist/release/${{ env.SCREENPILOT_VERSION }}/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          name: ScreenPilot-windows-release
          path: release

      - name: Verify downloaded release assets
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Substring(1)
          & .\packaging\verify-release-assets.ps1 -ReleaseDirectory .\release -Version $version

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            "release/ScreenPilot-Setup-${GITHUB_REF_NAME#v}-x64.exe"
            "release/ScreenPilot-Setup-${GITHUB_REF_NAME#v}-x64.exe.sha256"
            "release/appfleet-manifest.json"
          )
          for asset in "${assets[@]}"; do test -s "$asset"; done

          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ScreenPilot ${GITHUB_REF_NAME#v}" \
            --notes "Windows x64 installer with embedded Java 21 runtime. Settings are stored in %APPDATA%\\PashaApps\\ScreenPilot and logs in %LOCALAPPDATA%\\PashaApps\\ScreenPilot." \
            --latest
